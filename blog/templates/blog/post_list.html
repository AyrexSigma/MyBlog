<!DOCTYPE html>
<html>
<head>
    <title>Blog Posts</title>
</head>
<body>
    <h1>All Posts</h1>
    {% for post in posts %}
        <article>
            <h2><a href="{% url 'post_detail' post.pk %}">{{ post.title }}</a></h2>
            <p>By <a href="{% url 'author_posts' post.author.id %}">{{ post.author.name }}</a></p>
            <time>{{ post.published_date }}</time>
            <p>{{ post.content|truncatechars:150 }}</p>
        </article>
    {% endfor %}
</body>
</html>
