<!DOCTYPE html>
<html>
<head>
    <title>Мій Блог</title>
</head>
<body>
    <h1>Останні пости</h1>
    {% for post in posts %}
        <article>
            <h2>{{ post.title }}</h2>
            <time>{{ post.published_date }}</time>
            <p>{{ post.content|truncatechars:100 }}</p>
        </article>
    {% endfor %}
</body>
</html>
